# CI (P1-04): the same `npm run validate` as locally, on every PR and on main.
# Actions are pinned to full commit SHAs (immutable; the tag is in the comment).
# Versions checked 22.10.2026 with `git ls-remote --tags` of the official repos.
name: CI

on:
  # No branch filter: stacked PRs (base other than main) are checked too.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR (or per ref for push). A new push to a PR cancels the
  # outdated run; runs on main are never cancelled, every main commit keeps
  # its own result.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: TEMP probe — changed Mermaid diagram without SVG (reverted next commit)
        run: |
          sed -i 's/P\[Parse и inspect как данные\]/P[Parse и inspect как данные, probe]/' content/handbook.md
          grep -q 'как данные, probe' content/handbook.md
          npm run content
          git status --short

      - name: npm run validate
        run: npm run validate

      # render-diagrams.mjs writes `error` to the manifest instead of failing
      # when a changed diagram cannot be rendered (no Chrome in CI). This gate
      # makes CI fail closed: every diagram needs its committed SVG.
      - name: Mermaid SVG committed
        run: node .github/scripts/check-diagram-assets.mjs

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # PR runs build the merge commit; name the artifact by the PR head.
          name: dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
          if-no-files-found: error
          # dist/client/.assetsignore and dist/*/.vite/manifest.json are part of
          # the build. Hidden dist/.openai/hosting.json holds only the Sites
          # project id that is already in git; no .env*/.dev.vars in dist.
          include-hidden-files: true
          retention-days: 14
